<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site com Cookies</title>
    <link rel="stylesheet" href="/site_cookies/src/styles/style.css" />
  </head>
  <body>
    <div class="layout">
      <div class="conteudo">
        <h1>Bem-vindo ao nosso site!</h1>
        <p>Este é um exemplo simples de um site que utiliza cookies.</p>
      </div>
      <div class="cookie-consentimento" id="cookie-consentimento">
        <img src="/site_cookies/src/assets/cookie-clicker.svg" alt="Cookie" />
        <span class="recusar-cookies">X</span>
        <p>Este site utiliza cookies para melhorar sua experiência.</p>
        <button class="aceitar-cookies">Aceitar</button>
      </div>
      <footer>&copy; Licenciado sob MIT</footer>
    </div>
    <script src="/site_cookies/src/javascript/scripts.js"></script>
  </body>
</html>
