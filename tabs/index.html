<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabs</title>
    <link rel="stylesheet" href="/tabs/src/styles/style.css" />
  </head>
  <body>
    <div class="layout">
      <main>
        <div class="botao-aba">
          <button class="botoes ativo" content-id="primeira_aba">Primeira aba</button>
          <button class="botoes" content-id="segunda_aba">Segunda aba</button>
          <button class="botoes" content-id="terceira_aba">Terceira aba</button>
          <button class="botoes" content-id="quarta_aba">Quarta aba</button>
        </div>

        <div class="aba-conteudos">
          <div class="conteudo" id="primeira_aba">
            <p>Primeira aba feita com js</p>
          </div>

          <div class="conteudo" id="segunda_aba">
            <p>Segunda aba feita com js</p>
          </div>

          <div class="conteudo" id="terceira_aba">
            <p>Terceira aba feita com js</p>
          </div>

          <div class="conteudo" id="quarta_aba">
            <p>Quarta aba feita com js</p>
          </div>
        </div>
      </main>
      <footer>&copy; Licenciado sob MIT</footer>
    </div>

    <script src="/tabs/src/javascript/scripts.js"></script>
  </body>
</html>
